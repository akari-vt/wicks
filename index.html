<meta charset="utf-8">
<title>灯芯遊行</title>
<!--
  灯理 ― 灯芯遊行（わんコメ / OneComme 用，平常直播都能用）
  ・留言的人會變成灯芯在畫面下方走來走去，頭上冒出留言泡泡，名字旁邊顯示會員徽章
  ・在聊天室貼「灯px:…」咒語（灯芯像素工房產生）就換成自己打扮的灯芯，之後每次留言都沿用
  ・Super Chat：跳起來＋金色星星＋泡泡上顯示金額；這場直播之後的留言都戴皇冠、泡泡是金色（重新載入來源後重置）
  ・新會員：愛心飄起來　・會員里程碑：彩帶噴發　・贈送會員：灑出禮物盒　・收到會員禮物：小愛心
  ・管理：灯理或管理員留言「灯reset 名字」，可以把那個人自己畫的灯芯換回預設
  ・灯理本人：在工房的自由模式（網址加 ?free=1）畫的造型不受外框限制，只有頻道主的留言才會照原樣顯示
  ・限定配件／特殊造型：寫在同資料夾的 items.js（說明在那個檔案裡）
      觀眾：「灯get 名字」兌換（只在開放日期內有效）、「灯wear 名字」戴上／拿下、「灯wear 無」全部拿下
      灯理或管理員：「灯give 觀眾名字 配件名字」直接送、「灯take 觀眾名字 配件名字」收回
  ・URL 參數（加在 OBS 網址後面，例如 ?size=4&y=0.95）：
      size   像素放大倍率（預設 4 → 64px）       y     走路的高度（0~1，預設 0.96 = 畫面底部）
      max    同時最多幾隻（預設 40）              idle  幾分鐘沒留言就離場（預設 15）
      bubble 泡泡顯示秒數（預設 5）               owner 0 = 灯理自己的留言不出場（預設會出場）
      demo   1 = 示範模式，不用開直播也會有假灯芯（含 SC、會員、贈訂、里程碑示範）
      debug  1 = 左下角一直顯示連線狀態
-->
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
#stage{position:fixed;inset:0;pointer-events:none}
.w{position:absolute;left:0;top:0;will-change:transform;transition:opacity .8s}
.w .body{position:relative}
.w canvas.me{display:block;image-rendering:pixelated;filter:drop-shadow(0 2px 0 rgba(60,30,20,.45))}
.w .shadow{position:absolute;left:18%;right:18%;bottom:-5px;height:5px;border-radius:50%;background:rgba(0,0,0,.25)}
.w .name{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:7px;white-space:nowrap;
  display:flex;align-items:center;gap:3px;font-size:14px;font-weight:700;color:#fff;letter-spacing:.03em;
  text-shadow:0 0 3px #3a2a2a,0 0 3px #3a2a2a,0 0 6px #3a2a2a}
.w .name span{max-width:160px;overflow:hidden;text-overflow:ellipsis}
.w .name img{width:16px;height:16px;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.w .bubble{position:absolute;left:50%;bottom:100%;margin-bottom:10px;transform:translateX(-50%) scale(.6);opacity:0;
  transform-origin:50% 100%;transition:transform .25s cubic-bezier(.3,1.6,.6,1),opacity .2s;
  background:#fff;color:#3a2a33;border:2.5px solid #3a2a33;border-radius:13px;padding:5px 10px;
  font-size:16px;font-weight:700;line-height:1.35;max-width:250px;width:max-content;word-break:break-word;text-align:center}
.w .bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#3a2a33}
.w .bubble img{height:1.25em;vertical-align:-.22em}
.w .bubble img.sticker{height:56px;display:block;margin:2px auto 0}
.w .bubble.show{transform:translateX(-50%) scale(1);opacity:1}
.w .bubble.tagonly{background:none!important;border:0;padding:0}
.w .bubble.tagonly::after{display:none}
.w .bubble.tagonly .tag{margin:0;font-size:15px;padding:3px 12px}
.w .tag{display:block;width:max-content;margin:-17px auto 3px;padding:1px 9px;border-radius:999px;font-size:13px;letter-spacing:.04em;
  color:#fff;border:2px solid #3a2a33;background:#3a2a33;white-space:nowrap}
.w .tag.sc{background:linear-gradient(90deg,#ffb84d,#f08a3c)}
.w .tag.member{background:linear-gradient(90deg,#ff8fb8,#f06292)}
.w .tag.mile{background:linear-gradient(90deg,#a98bff,#7c5cff)}
.w .tag.gift{background:linear-gradient(90deg,#5fcf9f,#2fa77a)}
.w.sc .bubble{background:linear-gradient(135deg,#fff6d6,#ffe08a)}
.w.sc canvas.me{filter:drop-shadow(0 0 5px #ffd95e) drop-shadow(0 0 10px #ffb03b)}
.w .crown{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:15px;display:none}
.w.sc .crown{display:block}
.p{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.p.star{width:8px;height:8px;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.p.heart{font-size:18px;line-height:1;text-shadow:0 0 4px #fff}
.p.conf{width:7px;height:11px;border-radius:2px}
.p.box{width:24px;height:24px;image-rendering:pixelated}
.pop{animation:pop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
</style>

<script>
/* ===== 連線狀態小標籤：載入時顯示 6 秒，網址加 ?debug=1 會一直顯示 ===== */
function showStatus(label){
  const Q=new URLSearchParams(location.search);
  const el=document.createElement('div');
  el.style.cssText='position:fixed;left:16px;bottom:16px;z-index:99;padding:8px 14px;border-radius:999px;'+
    'font:700 16px "Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff;background:rgba(40,30,60,.85);transition:opacity .8s;pointer-events:none';
  document.body.appendChild(el);
  const set=(t,ok)=>{el.textContent=label+'：'+t;el.style.background=ok?'rgba(46,140,96,.9)':'rgba(190,60,70,.92)';};
  if(!window.OneSDK){set('找不到 OneSDK，請改用わんコメ模板列表裡複製的網址',false);return;}
  el.textContent=label+'：連線中…';
  let n=0;const iv=setInterval(()=>{n++;
    if(window.OneSDK.connected){set('已連上わんコメ ✦ 有人留言就會出現',true);clearInterval(iv);
      if(Q.get('debug')!=='1')setTimeout(()=>el.style.opacity=0,6000);}
    else if(n===8)set('連不上わんコメ，請確認わんコメ有開著',false);
  },1000);
}
/* ===== 連線狀態結束 ===== */

<script>
(() => {
const Q = new URLSearchParams(location.search);
const CFG = {
  size:   +Q.get('size')   || 4,
  y:      +Q.get('y')      || 0.96,
  max:    +Q.get('max')    || 40,
  idle:   +Q.get('idle')   || 15,
  bubble: +Q.get('bubble') || 5,
  owner:  Q.get('owner') !== '0',
};
/* ===== 灯芯像素：共用定義（像素工房、像素遊行、片尾名單三邊一致，改這裡要三邊一起改） ===== */
const N = 16;
const PAL = [null,'#2a1c2e','#ffffff','#fff1c7','#ffd95e','#ffa63d','#e8692e','#e0574a',
  '#ffb3d1','#ff5f9e','#9fe2ff','#4a86ff','#c9a8ff','#8b5cff','#7be3b8','#2fa77a'];
// o 外框、a 天線（都鎖定） b 身體 c 臉 k 眼睛 r 嘴巴；灯芯固定是橘色
const BASE = [
  '................',
  '................',
  '...........aa...',
  '..........a.....',
  '.........a......',
  '.....oooooo.....',
  '...oobbbbbboo...',
  '..obbccccccbbo..',
  '.obckcccccckcbo.',
  '.obcckcccckccbo.',
  'obbckcrrrrckcbbo',
  'obbccrrrrrrccbbo',
  'obbcccrrrrcccbbo',
  'obbccccccccccbbo',
  'obbbccccccccbbbo',
  '.oooooooooooooo.'];
const BASE_STR = BASE.join('');
const LOCK  = [...BASE_STR].map(c => c === 'o' || c === 'a');
const SHAPE = [...BASE_STR].map(c => 'obckry'.includes(c));
const FACE  = [...BASE_STR].map((c,i) => 'ckr'.includes(c) && i >= 7*N);
const BODY = 5, LINE = 6;
function basePx(){
  const m = {'.':0,o:LINE,a:LINE,b:BODY,y:4,c:3,k:1,r:7};
  return [...BASE_STR].map(c => m[c]);
}
// 不管咒語怎麼寫，外框一定是灯芯的形狀和顏色、身體裡不會破洞
function sanitize(px){
  const out = px.slice(0, N*N), base = basePx();
  for (let i = 0; i < N*N; i++) {
    if (LOCK[i]) out[i] = LINE;
    else if (SHAPE[i] && !out[i]) out[i] = base[i];
  }
  return out;
}
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function b64(bytes){let s='',i=0;for(;i+2<bytes.length;i+=3){const n=bytes[i]<<16|bytes[i+1]<<8|bytes[i+2];
  s+=B64[n>>18&63]+B64[n>>12&63]+B64[n>>6&63]+B64[n&63];}
  const r=bytes.length-i;if(r===1){const n=bytes[i]<<16;s+=B64[n>>18&63]+B64[n>>12&63];}
  else if(r===2){const n=bytes[i]<<16|bytes[i+1]<<8;s+=B64[n>>18&63]+B64[n>>12&63]+B64[n>>6&63];}return s;}
function unb64(s){const o=[];let b=0,n=0;for(const c of s){const v=B64.indexOf(c);if(v<0)return null;b=b<<6|v;n+=6;if(n>=8){n-=8;o.push(b>>n&255);}}return o;}
function encode(px){
  const raw=[];for(let i=0;i<px.length;i+=2)raw.push(px[i]<<4|px[i+1]);
  const rle=[];let i=0;while(i<px.length){const c=px[i];let n=1;while(i+n<px.length&&px[i+n]===c&&n<16)n++;rle.push(c<<4|(n-1));i+=n;}
  return '灯px:'+(rle.length<raw.length?'B'+b64(rle):'A'+b64(raw));
}
// 不套外框的原始解碼（頻道主的自由造型、限定配件用）
function decodeRaw(text){
  const m=/px[:：]\s*([AB])([A-Za-z0-9_-]{2,})/.exec(text||'');if(!m)return null;
  const bytes=unb64(m[2]);if(!bytes)return null;const px=[];
  if(m[1]==='A'){for(const b of bytes)px.push(b>>4,b&15);}
  else{for(const b of bytes){const c=b>>4,k=(b&15)+1;for(let i=0;i<k;i++)px.push(c);}}
  return px.length>=N*N?px.slice(0,N*N):null;
}
function decode(text){ const px=decodeRaw(text); return px?sanitize(px):null; }
function paintPx(cv, px){
  cv.width = cv.height = N; const g = cv.getContext('2d'); g.clearRect(0,0,N,N);
  for (let i = 0; i < N*N; i++) { const c = PAL[px[i]]; if (c) { g.fillStyle = c; g.fillRect(i%N, (i/N)|0, 1, 1); } }
}
/* ===== 共用定義結束 ===== */

const store = {
  get(id){try{return JSON.parse(localStorage.getItem('slp:px:'+id));}catch(e){return null;}},
  set(id,px){try{localStorage.setItem('slp:px:'+id,JSON.stringify(px));}catch(e){}},
};

const stage = document.getElementById('stage');
const walkers = new Map();
const seen = new Set();
const scUsers = new Set();   // 這場直播丟過 SC 的人（6 小時沒有活動就清空）
const SZ = N * CFG.size;
const names = new Map();     // 名字 → userId（給管理指令用）
let groundY = 0;

function stripHtml(html){
  const d=document.createElement('div');d.innerHTML=html||'';
  const out=document.createElement('span');
  d.childNodes.forEach(function walk(n){
    if(n.nodeType===3) out.appendChild(document.createTextNode(n.textContent));
    else if(n.nodeName==='IMG'){const i=document.createElement('img');i.src=n.getAttribute('src');out.appendChild(i);}
    else n.childNodes.forEach(walk);
  });
  return out;
}
function setBadges(w,d){
  const box=w.el.querySelector('.badges');box.innerHTML='';
  (d.badges||[]).forEach(b=>{
    if(!b||!b.url||b.type==='svg'||!/^(https?:|data:image)/.test(b.url))return;
    const i=document.createElement('img');i.src=b.url;i.alt=b.label||'';box.appendChild(i);
  });
}
function makeWalker(d){
  const el=document.createElement('div');el.className='w';
  el.innerHTML='<div class="bubble"></div><div class="body pop"><div class="crown">👑</div>'+
    '<canvas class="me" width="16" height="16"></canvas><div class="shadow"></div><div class="name"><b class="badges"></b><span></span></div></div>';
  const cv=el.querySelector('canvas');cv.style.width=cv.style.height=SZ+'px';
  el.querySelector('.name span').textContent=d.displayName||d.name||'';
  stage.appendChild(el);
  const w={id:d.userId,el,cv,x:Math.random()*(innerWidth-SZ),y:innerHeight*CFG.y-SZ-24,dir:Math.random()<.5?-1:1,
    speed:24+Math.random()*30,pause:0,phase:Math.random()*6,last:Date.now(),bubbleT:null,jump:0};
  paintPx(cv,compose(d.userId));
  if(scUsers.has(d.userId))el.classList.add('sc');
  walkers.set(d.userId,w);
  if(walkers.size>CFG.max){let old=null;for(const v of walkers.values())if(v!==w&&(!old||v.last<old.last))old=v;if(old)leave(old);}
  return w;
}
function resetUser(name){
  const id=names.get(name)||names.get(name.replace(/^@/,''));if(!id)return;
  try{localStorage.removeItem('slp:px:'+id);}catch(e){}
  try{localStorage.removeItem('slp:free:'+id);}catch(e){}
  repaint(id);
}
function leave(w){walkers.delete(w.id);w.el.style.opacity=0;setTimeout(()=>w.el.remove(),900);}
function say(w,node,tag,ms){
  const b=w.el.querySelector('.bubble');b.innerHTML='';
  if(tag){const t=document.createElement('span');t.className='tag '+tag.cls;t.textContent=tag.text;b.appendChild(t);}
  if(node)b.appendChild(node);
  b.style.marginBottom=tag&&node?'20px':'';b.classList.toggle('tagonly',!!tag&&!node);
  b.classList.add('show');
  clearTimeout(w.bubbleT);w.bubbleT=setTimeout(()=>b.classList.remove('show'),ms||CFG.bubble*1000);
}
function txt(s){const t=document.createElement('span');t.textContent=s;return t;}

/* ===== 粒子特效 ===== */
const parts=[];
function addPart(el,x,y,vx,vy,g,life,spin,bounce){el.classList.add('p');stage.appendChild(el);
  parts.push({el,x,y,vx,vy,g,life,max:life,rot:Math.random()*360,spin:spin||0,bounce:!!bounce});}
const rnd=(a,b)=>a+Math.random()*(b-a);
const center=w=>[w.x+SZ/2,w.y+SZ/2];
function fxStars(w,n,colors){const [cx,cy]=center(w);
  for(let i=0;i<n;i++){const e=document.createElement('div');e.className='star';e.style.background=colors[i%colors.length];
    const a=rnd(0,Math.PI*2),v=rnd(120,240);addPart(e,cx,cy,Math.cos(a)*v,Math.sin(a)*v-120,380,rnd(.8,1.2),rnd(-400,400));}}
function fxHearts(w,n){const [cx,cy]=center(w);
  for(let i=0;i<n;i++){const e=document.createElement('div');e.className='heart';e.textContent='♥';
    e.style.color=['#ff6fa8','#ff9cc4','#f06292'][i%3];addPart(e,cx+rnd(-SZ/2,SZ/2),cy,rnd(-40,40),rnd(-150,-80),-10,rnd(1.6,2.4),rnd(-60,60));}}
function fxConfetti(w,n){const [cx,cy]=center(w);
  for(let i=0;i<n;i++){const e=document.createElement('div');e.className='conf';
    e.style.background=['#ffd95e','#ff6fa8','#8be0ff','#a98bff','#6fe3b5','#ffa63d'][i%6];
    addPart(e,cx,cy,rnd(-220,220),rnd(-560,-360),620,rnd(2,2.8),rnd(-720,720));}}
const BOX=(()=>{const c=document.createElement('canvas');c.width=c.height=8;const g=c.getContext('2d');
  const rows=['.y....y.','..y..y..','pppyyppp','pppyyppp','yyyyyyyy','pppyyppp','pppyyppp','pppyyppp'];
  const col={p:'#ff7eb0',y:'#ffd95e'};rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(col[ch]){g.fillStyle=col[ch];g.fillRect(x,y,1,1);}}));return c;})();
function fxGifts(w,n){const [cx,cy]=center(w);
  for(let i=0;i<Math.min(30,Math.max(4,n*3));i++){const e=document.createElement('canvas');e.className='box';e.width=e.height=8;
    e.getContext('2d').drawImage(BOX,0,0);addPart(e,cx-12,cy-12,rnd(-280,280),rnd(-480,-300),760,rnd(2.6,3.4),rnd(-300,300),true);}
  fxConfetti(w,16);}

/* ===== 限定配件／特殊造型 ===== */
const ITEMS=(window.AKARI_ITEMS||[]).map(it=>Object.assign({},it,{name:String(it.name||'').trim(),px:decodeRaw(it.code)})).filter(it=>it.name&&it.px);
const itemBy=n=>ITEMS.find(it=>it.name===String(n).trim());
const inv={get(id){try{return JSON.parse(localStorage.getItem('slp:inv:'+id))||{own:[],wear:[]};}catch(e){return {own:[],wear:[]};}},
  set(id,v){try{localStorage.setItem('slp:inv:'+id,JSON.stringify(v));}catch(e){}}};
const isFree=id=>{try{return localStorage.getItem('slp:free:'+id)==='1';}catch(e){return false;}};
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function open_(it){const t=today();return (!it.from||t>=it.from)&&(!it.to||t<=it.to);}
function compose(id){
  const saved=store.get(id);
  let px=saved&&saved.length===N*N?(isFree(id)?saved.slice():sanitize(saved)):basePx();
  const worn=inv.get(id).wear.map(itemBy).filter(Boolean);
  worn.filter(it=>it.type==='造型').forEach(it=>{px=it.px.slice();});
  worn.filter(it=>it.type!=='造型').forEach(it=>it.px.forEach((c,i)=>{if(c)px[i]=c;}));
  return px;
}
function repaint(id){const w=walkers.get(id);if(w)paintPx(w.cv,compose(id));}
function wearIt(v,it){
  if(it.type==='造型')v.wear=v.wear.filter(n=>{const x=itemBy(n);return !x||x.type!=='造型';});
  if(!v.wear.includes(it.name))v.wear.push(it.name);
}
function grant(id,it,w){
  const v=inv.get(id);if(!v.own.includes(it.name))v.own.push(it.name);wearIt(v,it);inv.set(id,v);repaint(id);
  if(w){w.jump=1;w.jh=1.2;fxStars(w,20,['#ffd95e','#ff9cc4','#fff']);say(w,txt(`✦ 獲得「${it.name}」！`),null,4500);}
}
function itemCommand(d,plain,w){
  let m;
  if((m=/^\s*灯get\s*(\S+)\s*$/.exec(plain))){const it=itemBy(m[1]);if(!it)return true;
    if(open_(it)||inv.get(d.userId).own.includes(it.name))grant(d.userId,it,w);
    else say(w,txt(`「${it.name}」現在不能兌換喔`),null,3500);return true;}
  if((m=/^\s*灯wear\s*(\S+)\s*$/.exec(plain))){const v=inv.get(d.userId);
    if(/^(無|无|none|全部)$/i.test(m[1])){v.wear=[];inv.set(d.userId,v);repaint(d.userId);return true;}
    const it=itemBy(m[1]);if(!it||!v.own.includes(it.name)){say(w,txt('還沒有這個配件喔'),null,3000);return true;}
    if(v.wear.includes(it.name))v.wear=v.wear.filter(n=>n!==it.name);else wearIt(v,it);
    inv.set(d.userId,v);repaint(d.userId);w.jump=1;w.jh=.6;return true;}
  return false;
}
function adminCommand(d,plain){
  if(!(d.isOwner||d.isModerator))return false;
  let m;
  if((m=/^\s*灯reset\s+@?(.+?)\s*$/.exec(plain))){resetUser(m[1]);return true;}
  if((m=/^\s*灯give\s+@?(.+?)\s+(\S+)\s*$/.exec(plain))){const id=names.get(m[1]),it=itemBy(m[2]);if(id&&it)grant(id,it,walkers.get(id));return true;}
  if((m=/^\s*灯take\s+@?(.+?)\s+(\S+)\s*$/.exec(plain))){const id=names.get(m[1]),it=itemBy(m[2]);
    if(id&&it){const v=inv.get(id);v.own=v.own.filter(n=>n!==it.name);v.wear=v.wear.filter(n=>n!==it.name);inv.set(id,v);repaint(id);}return true;}
  return false;
}

/* ===== 留言處理 ===== */
function isFresh(d){const t=Date.parse(d.timestamp)||+d.timestamp||Date.now();return Date.now()-t<60*1000;}
function onComment(c){
  if(!c||!c.data||c.service==='system')return;
  const d=c.data;
  if(seen.has(d.id))return; seen.add(d.id);
  const plain=(d.comment||'').replace(/<[^>]+>/g,'');
  names.set(d.displayName||d.name,d.userId);
  if(adminCommand(d,plain))return;
  if(d.isOwner && !CFG.owner)return;
  const fresh=isFresh(d);
  const w=walkers.get(d.userId)||makeWalker(d);
  w.last=Date.now(); w.pause=0; w.badges=d.badges||[];
  setBadges(w,d);
  if(itemCommand(d,plain,w))return;
  const raw=decodeRaw(d.comment);
  if(raw){
    // 只有頻道主可以用不受外框限制的造型
    if(d.isOwner){store.set(d.userId,raw);try{localStorage.setItem('slp:free:'+d.userId,'1');}catch(e){}}
    else{store.set(d.userId,sanitize(raw));try{localStorage.removeItem('slp:free:'+d.userId);}catch(e){}}
    repaint(d.userId);
    if(fresh){w.jump=1;w.jh=1;fxStars(w,14,['#ffd95e','#fff']);say(w,txt('✦ 變身完成！'),null,3500);}
    return;
  }
  if(!fresh)return;
  const body=stripHtml(d.comment), has=body.textContent.trim()||body.querySelector('img');
  const gt=d.giftType;
  if(gt==='sponsorgift'){
    const n=d.giftCount||1;w.jump=1;w.jh=1.4;fxGifts(w,n);
    say(w,null,{cls:'gift',text:`🎁 送出 ${n} 份會員禮物！`},7000);return;
  }
  if(gt==='giftreceived'){w.jump=1;w.jh=.8;fxHearts(w,6);say(w,null,{cls:'member',text:'♡ 收到會員禮物'},4000);return;}
  if(gt==='subscribe'){
    w.jump=1;w.jh=1.2;fxHearts(w,16);say(w,has?body:null,{cls:'member',text:'✦ WELCOME 新會員'},7000);return;
  }
  if(gt==='milestonechat'){
    w.jump=1;w.jh=1.4;fxConfetti(w,46);
    const m=d.membership&&(d.membership.primary||d.membership.sub);
    say(w,has?body:null,{cls:'mile',text:'🎉 '+(m||'會員里程碑')},8000);return;
  }
  if(d.hasGift&&(d.paidText||d.price)){
    scUsers.add(d.userId);w.el.classList.add('sc');w.jump=1;w.jh=1.2;fxStars(w,22,['#ffd95e','#ffb03b','#fff']);
    if(gt==='supersticker'){const im=body.querySelector('img');if(im){im.className='sticker';say(w,im,{cls:'sc',text:d.paidText||''},8000);return;}}
    say(w,has?body:null,{cls:'sc',text:d.paidText||('$'+d.price)},8000);return;
  }
  if(gt==='jewel'){w.jump=1;w.jh=.8;fxStars(w,10,['#8be0ff','#fff']);say(w,has?body:null,{cls:'gift',text:'💎 寶石禮物'},5000);return;}
  if(has) say(w,body);
}

/* ===== 走路與特效 ===== */
let t0=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-t0)/1000);t0=t;
  const W=innerWidth,baseY=innerHeight*CFG.y-SZ-24;groundY=baseY+SZ;
  const now=Date.now();
  for(const w of walkers.values()){
    if(now-w.last>CFG.idle*60000){leave(w);continue;}
    if(w.pause>0){w.pause-=dt;} else {
      w.x+=w.dir*w.speed*dt;
      if(w.x<0){w.x=0;w.dir=1;} if(w.x>W-SZ){w.x=W-SZ;w.dir=-1;}
      if(Math.random()<dt*.25){w.pause=1+Math.random()*3;}
      if(Math.random()<dt*.12){w.dir*=-1;}
    }
    w.phase+=dt*(w.pause>0?2:9);
    let hop=w.pause>0?Math.abs(Math.sin(w.phase))*1.5:Math.abs(Math.sin(w.phase))*SZ*.09;
    if(w.jump>0){w.jump-=dt*1.6;hop+=Math.sin(Math.max(0,w.jump)*Math.PI)*SZ*1.1*(w.jh||1);}
    w.y=baseY-hop;
    w.el.style.transform=`translate(${w.x}px,${w.y}px)`;
    w.cv.style.transform=`scaleX(${-w.dir})`;
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.spin*dt;p.life-=dt;
    if(p.bounce&&p.y>groundY-20&&p.vy>0){p.y=groundY-20;p.vy*=-.35;p.vx*=.6;p.spin*=.5;}
    if(p.life<=0){p.el.remove();parts.splice(i,1);continue;}
    p.el.style.opacity=Math.min(1,p.life/.6);
    p.el.style.transform=`translate(${p.x}px,${p.y}px) rotate(${p.rot}deg)`;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ===== 記住畫面上的灯芯：切換場景、來源重新載入後會回到原位 ===== */
const SKEY='slp:parade:state';
function saveState(){
  try{localStorage.setItem(SKEY,JSON.stringify({t:Date.now(),sc:[...scUsers],
    w:[...walkers.values()].map(w=>({id:w.id,n:w.el.querySelector('.name span').textContent,b:w.badges||[],last:w.last,x:Math.round(w.x),dir:w.dir}))}));}catch(e){}
}
function restoreState(){
  let st=null;try{st=JSON.parse(localStorage.getItem(SKEY));}catch(e){}
  if(!st||Date.now()-st.t>6*3600e3)return;
  (st.sc||[]).forEach(id=>scUsers.add(id));
  (st.w||[]).forEach(o=>{
    if(Date.now()-o.last>CFG.idle*60000||walkers.has(o.id))return;
    const w=makeWalker({userId:o.id,name:o.n,displayName:o.n,badges:o.b});
    w.last=o.last;w.badges=o.b;setBadges(w,{badges:o.b});
    if(o.x>=0&&o.x<=innerWidth-SZ)w.x=o.x;if(o.dir)w.dir=o.dir;
    names.set(o.n,o.id);
  });
}
restoreState();
setInterval(saveState,2000);
addEventListener('beforeunload',saveState);

/* ===== 接上わんコメ ===== */
function handle(arg){const list=Array.isArray(arg)?arg:(arg&&arg.comments)||[];list.forEach(onComment);}
showStatus('灯芯遊行');
const sdk=window.OneSDK;
if(sdk){
  Promise.resolve(sdk.ready&&sdk.ready()).then(()=>{
    const op={mode:'diff'};
    if(sdk.usePermission&&sdk.PERM) op.permissions=sdk.usePermission([sdk.PERM.COMMENT]);
    sdk.setup(op);
    sdk.subscribe({action:'comments',callback:handle});
    return sdk.connect();
  }).catch(e=>console.error(e));
}
